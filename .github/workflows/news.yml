# Новости: раз в час забирает публичные RSS-ленты СМИ (Kabar, 24.kg, Kloop; для Турции — AA, TRT, Hürriyet, Sözcü)
# и кладёт заголовки + ссылки в news/*.json. Приложение читает их со своего адреса — без сторонних RSS-прокси и ключей.
name: News headlines
on:
  schedule:
    - cron: "7 * * * *"   # каждый час, минута 7
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: news
  cancel-in-progress: false
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Fetch RSS
        run: node bot/news_fetch.js
      - name: Commit news
        run: |
          git config user.name "taza-aba-bot"
          git config user.email "bot@users.noreply.github.com"
          git add news
          if git diff --staged --quiet; then echo "no new headlines"; exit 0; fi
          git commit -m "news: headlines $(date -u +'%F %H:%M')"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done
          exit 1
