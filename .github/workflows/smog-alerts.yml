# Смог-алерты в Telegram. Без секрета TELEGRAM_BOT_TOKEN — no-op (успешный выход).
name: Smog alerts
on:
  schedule:
    - cron: "15 * * * *"   # каждый час, минута 15
  workflow_dispatch:
permissions:
  contents: write
jobs:
  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Inert without token
        if: ${{ !secrets.TELEGRAM_BOT_TOKEN }}
        run: echo "TELEGRAM_BOT_TOKEN not set — skip"; exit 0
      - name: Pull new /start subscriptions
        if: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node bot/webhook_stub.js
      - name: Commit subscriber updates
        if: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          git config user.name "taza-aba-bot"
          git config user.email "bot@users.noreply.github.com"
          git add bot/subscribers.json
          git diff --staged --quiet || git commit -m "bot: update subscribers"
          git push || true
      - name: Send alerts
        if: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node bot/send_alerts.js
